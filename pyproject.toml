[project]
name = "mas"
version = "0.1.0"
description = "Evolutionary multi-agent collaboration system (MAIE5221 final project)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "httpx>=0.27",
    "ddgs>=9.0",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
mas = "mas.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mas*"]

[tool.setuptools.package-data]
mas = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]

[tool.setuptools.data-files]
"share/mas/midtest/scenario_1_software_engineering 2" = ["testset/scenario_1_software_engineering 2/*.md"]
"share/mas/midtest/scenario_2_newsroom 2" = ["testset/scenario_2_newsroom 2/*.md"]
"share/mas/midtest/scenario_3_securities_fund 2" = ["testset/scenario_3_securities_fund 2/*.md"]
